name: Gemini AI Auto Blog Publisher

on:
  schedule:
    - cron: "0 */3 * * *"   # 8 posts/day
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Generate blog posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_posts.py

      - name: Commit & Push
        run: |
          git config user.name "gemini-blog-bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "🤖 Gemini auto-published 8 SEO posts" || exit 0
          git push
