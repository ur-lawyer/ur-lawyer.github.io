name: Gemini AI Auto Blog Publisher

on:
  push:
    branches: [ master ]     # ✅ run immediately on push
  schedule:
    - cron: "0 */6 * * *"    # ✅ every 6 hours
  workflow_dispatch:         # ✅ manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install google-genai pillow requests google-auth google-api-python-client tweepy selenium webdriver-manager undetected-chromedriver
          
      - name: Setup Chrome and Virtual Display
        run: |
          # Install Chrome and dependencies
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver xvfb x11-utils
          
          # Verify installation
          chromium-browser --version
          chromedriver --version
          
          echo "✅ Chrome and Xvfb installed"

      - name: Start Virtual Display
        run: |
          # Start Xvfb in background
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 2
          
          # Verify it's running
          ps aux | grep Xvfb
          
          echo "✅ Virtual display started on :99"

      - name: Generate blog post
        env:
          DISPLAY: ":99"  # Tell Chrome to use virtual display
          GSC_COOKIES: ${{ secrets.GSC_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          WEBPUSHR_API_KEY: ${{ secrets.WEBPUSHR_API_KEY }}
          WEBPUSHR_AUTH_TOKEN: ${{ secrets.WEBPUSHR_AUTH_TOKEN }}
        run: |
          python scripts/generate_posts.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-debug-screenshots
          path: /tmp/gsc*.png
          retention-days: 7

      - name: Commit & Push changes
        run: |
          git config user.name "gemini-blog-bot"
          git config user.email "bot@github.com"

          git add _posts/ images/ keywords.txt

          TITLES=$(git diff --cached --name-only | grep "_posts/" | sed 's#.*/##' | sed 's/.md//' | tr '\n' ',')

          git commit -m "${TITLES:-new post}" || exit 0
          git push origin master

      - name: Cleanup Chrome profile
        if: always()
        run: |
          echo "🧹 Cleaning up Chrome profile..."
          rm -rf "$HOME/.gsc_chrome_profile"
          echo "✅ Chrome profile removed"