name: Gemini AI Auto Blog Publisher

on:
  push:
    branches: [ master ]     # ✅ run immediately on push
  schedule:
    - cron: "0 */3 * * *"    # ✅ every 3 hours
  workflow_dispatch:         # ✅ manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade google-genai pillow

      - name: Generate blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
        run: |
          python scripts/generate_posts.py

      - name: Commit & Push changes
        run: |
          git config user.name "gemini-blog-bot"
          git config user.email "bot@github.com"

          git add _posts images || true

          TITLES=$(git diff --cached --name-only | grep "_posts/" | sed 's#.*/##' | sed 's/.md//' | tr '\n' ',')

          git commit -m "${TITLES:-new post}" || exit 0
          git push origin master
